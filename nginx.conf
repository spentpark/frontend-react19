server {
    listen 8065;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API del catálogo (backend-python). Se sirve bajo el mismo origen que el
    # frontend, así que el navegador no hace CORS y da igual abrir la app por
    # localhost, por la IP de la LAN o por la IP pública.
    location /api/ {
        proxy_pass http://backend:7000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        # Algunas consultas del catálogo (juego al azar, similares) son lentas.
        proxy_read_timeout 120s;
    }

    location /news-api/ {
    # Resolver DNS interno de Docker; se consulta en cada petición, no al arrancar
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Al usar variable, nginx ya no valida el host al iniciar
    set $news_upstream http://news:3001;

    # Con variable en proxy_pass, nginx NO reescribe la URI solo,
    # así que hay que hacerlo a mano: /news-api/x  ->  /api/x
    rewrite ^/news-api/(.*)$ /api/$1 break;

    proxy_pass $news_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
}
